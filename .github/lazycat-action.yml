version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/znote.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: znote

build:
  run_buildscript: false

images:
  - id: znote
    target: service
    service: znote
    source: helloz/znote
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: ZNote
    summary: "小而美的纯笔记应用，Markdown 所见即所得"
